<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tentang Kami - Latihan Inline CSS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #dee2e6;
        }
        h2 { color: #2c3e50; margin-top: 0; }
        img { 
            display: block; 
            margin: 20px auto; 
            border-radius: 8px;
            max-width: 100%;
        }
        .nav {
            margin-top: 30px;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .nav a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <main class="container">
        <!-- TODO 1: Tambahkan inline style pada div agar memiliki padding: 20px dan background-color: #e8f4f8 -->
        <div __="">
            <h2>Apa itu CSS?</h2>
            <p>Halaman ini difokuskan untuk latihan <strong>Inline CSS</strong>. Gaya ditulis langsung pada atribut <code>style</code> di dalam tag HTML.</p>

            <!-- TODO 2: Lengkapi atribut src dan alt pada tag <img> (Modul 2.3.8). Gunakan URL: https://via.placeholder.com/300x150 -->
            <img __="__" __="Gambar Ilustrasi CSS">

            <!-- TODO 3: Tambahkan inline style pada paragraf di bawah agar teks berwarna navy dan rata tengah (text-align: center) -->
            <p __="">
                CSS memisahkan konten (HTML) dari tampilan visual, sehingga pengelolaan desain menjadi lebih efisien.
            </p>

            <nav class="nav">
                Back to: <a href="index.html">Beranda</a> | 
                Next: <a href="contact.html">Kontak</a>
            </nav>
        </div>
    </main>
</body>
</html>
